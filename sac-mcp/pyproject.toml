[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sac-mcp"
version = "0.2.0"
description = "Servidor MCP somente leitura para o SAP Analytics Cloud Data Export Service"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27,<1",
  "keyring>=25",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
sac-mcp = "sac_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
